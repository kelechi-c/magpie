[project]
name = "magpie"
version = "0.1.0"
description = "fast qwen-image 2.1 turbo image editing on blackwell gpus"
requires-python = ">=3.12"
dependencies = ["torch", "numpy", "pillow", "safetensors", "transformers>=5.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magpie"]
